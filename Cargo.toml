[package]
name = "iris"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
authors = ["Santh <64453045+santhreal@users.noreply.github.com>"]
description = "Screenshot and screen-recording utility"

[lib]
name = "iris_lib"
crate-type = ["rlib"]

# Standalone crate: the Santh tree root above this directory has its own
# workspace; this table keeps iris out of it.
[workspace]

# The shipped binary is `cargo build --release`. Thin LTO inlines the
# hot pixel paths (swizzle, rasterize, encode) across the iris_lib /
# bin / gpui crate boundary; codegen-units=1 maximizes within-crate
# optimization. Compile time is a build cost, not a runtime one.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[dependencies]
serde = { version = "1", features = ["derive"] }
parking_lot = "0.12"
serde_json = "1"
toml = "0.8"
directories = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
# Glyph rasterization for the editor's text tool (draw_text).
ab_glyph = "0.2"
# mpsc channels + StreamExt drive the daemon command pump and the IPC
# accept thread on every platform, not just Linux.
futures = "0.3"
x11rb = { version = "0.13", features = ["composite", "damage", "randr", "xfixes", "shape", "shm"] }
gpui = "0.2.2"
libc = "0.2"
# Auto-update: HTTPS GET of the release manifest + asset download.
# rustls (no system OpenSSL), blocking API — the updater runs on its own
# thread, not the UI loop.
ureq = { version = "2", default-features = false, features = ["tls"] }
# Compares the running version against the release tag.
semver = "1"
arboard = "3"
# Cross-platform local IPC: Unix domain sockets on Unix, named pipes on
# Windows, behind one Listener/Stream API. Replaces the hand-rolled
# UnixListener + libc::poll single-instance socket.
interprocess = { version = "2", features = [] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", features = ["screenshot", "screencast"] }
enumflags2 = "0.7"
pipewire = "0.8"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
khronos-egl = { version = "6", features = ["dynamic"] }
libloading = "0.8"

[target.'cfg(windows)'.dependencies]
# Win32 for monitor enumeration, the foreground-window rect, region
# grabs, and CF_HDROP file copy. windows-sys is already in the tree
# through gpui.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
# Embeds packaging/windows/iris.rc (icon + version info) into iris.exe.
embed-resource = "3"

[dev-dependencies]
tempfile = "3"
serial_test = "3"

# The santhreal gpui fork's gpui-0.2.2-iris branch is crates.io 0.2.2
# (the "Bump gpui to 0.2.2" commit) plus fixes: wl_keyboard Modifiers
# and Key events that arrive before the first Keymap no longer panic on
# a missing keymap_state. Without it a Wayland daemon restart crashes
# when sway delivers early modifier state. It also sets the Wayland
# xdg_toplevel app_id before the first commit, and keeps the macOS
# window constructor compiling with that field. Pinned to a rev so a later
# fork push cannot move the dependency under the build.
[patch.crates-io]
gpui = { git = "https://github.com/santhreal/gpui.git", rev = "360f9a4d01", version = "=0.2.2" }
