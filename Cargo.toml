[package]
name = "iris"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
authors = ["Santh <64453045+santhreal@users.noreply.github.com>"]
description = "Screenshot and screen-recording utility"

[lib]
name = "iris_lib"
crate-type = ["rlib"]

# Standalone crate: the Santh tree root above this directory has its own
# workspace; this table keeps iris out of it.
[workspace]

# The shipped binary is `cargo build --release`. Thin LTO inlines the
# hot pixel paths (swizzle, rasterize, encode) across the iris_lib /
# bin / gpui crate boundary; codegen-units=1 maximizes within-crate
# optimization. Compile time is a build cost, not a runtime one.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[dependencies]
serde = { version = "1", features = ["derive"] }
parking_lot = "0.12"
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
directories = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
ab_glyph = "0.2"
x11rb = { version = "0.13", features = ["composite", "damage", "randr", "xfixes", "shape", "shm"] }
libc = "0.2"
arboard = "3"
gpui = "0.2.2"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", features = ["screenshot", "screencast"] }
enumflags2 = "0.7"
pipewire = "0.8"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
futures = "0.3"
khronos-egl = { version = "6", features = ["dynamic"] }
libloading = "0.8"

[dev-dependencies]
tempfile = "3"
serial_test = "3"
