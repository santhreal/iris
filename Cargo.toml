[package]
name = "iris"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
authors = ["Santh <64453045+santhreal@users.noreply.github.com>"]
description = "Screenshot and screen-recording utility"

[lib]
name = "iris_lib"
crate-type = ["rlib"]

# Standalone crate: the Santh tree root above this directory has its own
# workspace; this table keeps iris out of it.
[workspace]

# The shipped binary is `cargo build --release`. Thin LTO inlines the
# hot pixel paths (swizzle, rasterize, encode) across the iris_lib /
# bin / gpui crate boundary; codegen-units=1 maximizes within-crate
# optimization. Compile time is a build cost, not a runtime one.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[dependencies]
serde = { version = "1", features = ["derive"] }
parking_lot = "0.12"
serde_json = "1"
toml = "0.8"
directories = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
# Glyph rasterization for the editor's text tool (draw_text).
ab_glyph = "0.2"
# mpsc channels + StreamExt drive the daemon command pump and the IPC
# accept thread on every platform, not just Linux.
futures = "0.3"
x11rb = { version = "0.13", features = ["composite", "damage", "randr", "xfixes", "shape", "shm", "xinput"] }
gpui = "0.2.2"
libc = "0.2"
# Auto-update: HTTPS GET of the release manifest + asset download.
# rustls (no system OpenSSL), blocking API — the updater runs on its own
# thread, not the UI loop.
ureq = { version = "2", default-features = false, features = ["tls"] }
# Compares the running version against the release tag.
semver = "1"
arboard = "3"
# Cross-platform local IPC: Unix domain sockets on Unix, named pipes on
# Windows, behind one Listener/Stream API. Replaces the hand-rolled
# UnixListener + libc::poll single-instance socket.
interprocess = { version = "2", features = [] }
# Native window ids for GPUI windows: the X11 id, the Win32 HWND, the
# AppKit view.
raw-window-handle = "0.6"
# blocking 1.7 retires a pool thread only when the pool is over its
# 500-thread limit, so each pool thread wakes every 500 ms for the life
# of the process. zbus (the tray, the portals) and async-fs start one in
# every daemon. 1.6 retires a thread 500 ms after its last task.
blocking = "~1.6"

[target.'cfg(target_os = "linux")'.dependencies]
# async-io, not the default tokio: ashpd's tokio feature unifies into
# zbus for the whole binary, and zbus's blocking calls (the tray, GPUI's
# settings portal) then start a multi-thread tokio runtime with one
# worker per core in every daemon, on X11 as much as on Wayland.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screenshot", "screencast"] }
enumflags2 = "0.7"
pipewire = "0.8"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
khronos-egl = { version = "6", features = ["dynamic"] }
libloading = "0.8"

[target.'cfg(windows)'.dependencies]
# Win32 for monitor enumeration, the foreground-window rect, region
# grabs, CF_HDROP file copy, the shutter sound, the registry PATH
# searched for ffmpeg and tesseract, the parent console a command line
# prints to, the process starts that pass the child no handle, and the
# account SID that names and secures the daemon's pipe. windows-sys is
# already in the tree through gpui.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
# The UTF-16 security descriptor string interprocess takes for the
# daemon's pipe. Already in the tree through interprocess.
widestring = "1"

[target.'cfg(windows)'.build-dependencies]
# Embeds packaging/windows/iris.rc (icon + version info) into iris.exe.
embed-resource = "3"

[dev-dependencies]
tempfile = "3"
serial_test = "3"

# The santhreal gpui fork's gpui-0.2.2-iris branch is crates.io 0.2.2
# (the "Bump gpui to 0.2.2" commit) plus fixes: wl_keyboard Modifiers
# and Key events that arrive before the first Keymap no longer panic on
# a missing keymap_state. Without it a Wayland daemon restart crashes
# when sway delivers early modifier state. It also sets the Wayland
# xdg_toplevel app_id before the first commit, keeps the macOS
# window constructor compiling with that field, and adds
# App::set_quit_on_last_window_closed so the daemon runs with no window
# open, and PlatformDisplay::scale_factor, which reports the X11
# client's single scale before any window exists. Hover ends on
# MouseExited, which Windows now reports on WM_MOUSELEAVE, so a control
# the pointer leaves the window from does not stay hovered. An X11
# window is unmapped before its renderer is torn down, so a closing
# window does not blink black for a compositor frame, and its minimum
# size hint is in device pixels, so a window manager holds the minimum
# on a 2x display. An X11 move or resize anchors at the button press,
# so pointer travel before the press is handled still moves the window.
# A Wayland resize configure that arrives within a frame of the last one
# applies on the next frame instead of being dropped, so an interactive
# resize ends at the pointer. An X11 window requests frames only while
# it has something to draw, instead of running a timer at the display
# refresh rate, so an idle window costs no wakeups; a Wayland window
# requests frame callbacks only while it has something to draw, for the
# same reason. An X11 pop-up sets the ICCCM input hint to false, so a
# window manager never gives the toast or a notice the keyboard focus,
# and sets its position, no frame, and its window states before the
# map, so it opens where iris put it without a frame drawn and removed.
# An X11 window's renderer is created for the background it opens with,
# so a transparent window neither rebuilds its swapchain after the open
# nor shows black before its first frame. Every X11 window sets its
# position before the map, and a window that draws its own frame turns
# the window manager's frame off before the map, so each opens where
# iris put it with no frame drawn and removed; a configure that changes
# neither size nor origin lays out and draws nothing. Pinned to a rev so
# a later fork push cannot move the dependency under the build.
#
# The santhreal blade fork's blade-graphics-0.7.1-iris branch is
# crates.io blade-graphics 0.7.1 plus ContextDesc::ray_tracing, off by
# default. 0.7.1 enables the ray tracing extensions on every capable
# adapter; on NVIDIA that maps the ray tracing runtime into the daemon
# (+160 MB resident) and adds a driver thread, for a renderer that never
# traces a ray.
[patch.crates-io]
gpui = { git = "https://github.com/santhreal/gpui.git", rev = "d9bcbf412d", version = "=0.2.2" }
blade-graphics = { git = "https://github.com/santhreal/blade.git", rev = "dcee837cea", version = "=0.7.1" }
