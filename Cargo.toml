[package]
name = "iris"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
authors = ["Santh <64453045+santhreal@users.noreply.github.com>"]
description = "Screenshot and screen-recording utility"

[lib]
name = "iris_lib"
crate-type = ["rlib"]

# Standalone crate: the Santh tree root above this directory has its own
# workspace; this table keeps iris out of it.
[workspace]

# The shipped binary is `cargo build --release`. Thin LTO inlines the
# hot pixel paths (swizzle, rasterize, encode) across the iris_lib /
# bin / gpui crate boundary; codegen-units=1 maximizes within-crate
# optimization. Compile time is a build cost, not a runtime one.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[dependencies]
serde = { version = "1", features = ["derive"] }
parking_lot = "0.12"
# The records the libraries log (GPU, windowing, D-Bus) go to iris.log
# through iris_lib::log. Already in the tree through gpui.
log = "0.4"
serde_json = "1"
toml = "0.8"
directories = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
# Glyph rasterization for the editor's text tool (draw_text).
ab_glyph = "0.2"
# mpsc channels + StreamExt drive the daemon command pump and the IPC
# accept thread on every platform, not just Linux.
futures = "0.3"
# Santh GPUI: the framework crate and the platform crate that constructs
# the application for the current OS (X11 and Wayland on Linux, AppKit
# on macOS, Win32 on Windows). Pinned to a rev so a later push to
# santh-gpui cannot move the dependency under the build.
gpui = { git = "https://github.com/santhreal/santh-gpui.git", rev = "f0de1c9f2c5246073507458bf88d3d0fd456aac6" }
gpui_platform = { git = "https://github.com/santhreal/santh-gpui.git", rev = "f0de1c9f2c5246073507458bf88d3d0fd456aac6", features = ["font-kit", "wayland", "x11"] }
libc = "0.2"
# Auto-update: HTTPS GET of the release manifest + asset download.
# rustls (no system OpenSSL), blocking API — the updater runs on its own
# thread, not the UI loop.
ureq = { version = "2", default-features = false, features = ["tls"] }
# SHA-256 of an update download, checked against the release's .sha256
# sidecar. Already in the tree through ureq's rustls.
ring = "0.17"
# Compares the running version against the release tag.
semver = "1"
# Verifies an update download's .minisig against packaging/minisign.pub.
minisign-verify = "0.3"
arboard = "3"
# Cross-platform local IPC: Unix domain sockets on Unix, named pipes on
# Windows, behind one Listener/Stream API. Replaces the hand-rolled
# UnixListener + libc::poll single-instance socket.
interprocess = { version = "2", features = [] }
# Native window ids for GPUI windows: the X11 id, the Win32 HWND, the
# AppKit view.
raw-window-handle = "0.6"
# Library and toast deletes move the capture to the system trash
# (freedesktop Trash, the macOS Trash, the Windows Recycle Bin).
trash = "5"

[target.'cfg(target_os = "linux")'.dependencies]
# async-io, not the default tokio: ashpd's tokio feature unifies into
# zbus for the whole binary, and zbus's blocking calls (the tray, GPUI's
# settings portal) then start a multi-thread tokio runtime with one
# worker per core in every daemon, on X11 as much as on Wayland.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screenshot", "screencast"] }
enumflags2 = "0.7"
pipewire = "0.8"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
khronos-egl = { version = "6", features = ["dynamic"] }
libloading = "0.8"
# The Wayland clipboard through the compositor's data-control protocol
# (ext-data-control-v1 or wlr-data-control-unstable-v1), which a client
# with no focused window can set. Without it every copy on Wayland goes
# through the X server in DISPLAY, and the first one can start an
# on-demand XWayland.
arboard = { version = "3", features = ["wayland-data-control"] }
# X11: the root and window grabs, the recording sources, XDnD drag-out,
# and window placement.
x11rb = { version = "0.13", features = ["composite", "damage", "randr", "xfixes", "shape", "shm", "xinput"] }
# blocking 1.7 retires a pool thread only when the pool is over its
# 500-thread limit, so each pool thread wakes every 500 ms for the life
# of the process. zbus (the tray, the portals) and async-fs start one in
# every daemon. 1.6 retires a thread 500 ms after its last task.
blocking = "~1.6"

[target.'cfg(windows)'.dependencies]
# Win32 for monitor enumeration, the foreground-window rect, region
# grabs, CF_HDROP file copy, the shutter sound, the registry PATH
# searched for ffmpeg and tesseract, the parent console a command line
# prints to, the process starts that pass the child no handle, the
# account SID that names and secures the daemon's pipe, and the folder
# change notifications the library watches its captures with. windows-sys
# is already in the tree through gpui.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
# The UTF-16 security descriptor string interprocess takes for the
# daemon's pipe. Already in the tree through interprocess.
widestring = "1"

[target.'cfg(windows)'.build-dependencies]
# Embeds packaging/windows/iris.rc (icon + version info) into iris.exe.
embed-resource = "3"

[dev-dependencies]
tempfile = "3"
serial_test = "3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# XTest: tests/exit.rs clicks the window a recording picks.
x11rb = { version = "0.13", features = ["xtest"] }
# tests/tray.rs reads the tray item over a private session bus. The
# features the tray's ksni already builds zbus with.
zbus = { version = "5", default-features = false, features = ["async-io"] }
