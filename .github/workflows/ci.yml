name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Restrict the default token to read-only; jobs that need more declare it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          components: clippy
      - name: Install Linux build deps (gpui + pipewire + X11)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake clang \
            libasound2-dev libfontconfig-dev libglib2.0-dev libssl-dev \
            libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libxcb1-dev \
            libvulkan1 libegl1-mesa-dev libgl1-mesa-dev \
            libpipewire-0.3-dev libspa-0.2-dev \
            xdg-desktop-portal
      # Clippy is advisory: rustc warnings are already denied via
      # RUSTFLAGS=-Dwarnings, but the pre-existing pedantic style lints
      # (type_complexity, too_many_arguments) are not gating defects.
      - name: Clippy
        run: cargo clippy --locked --all-targets
      - name: Build release
        run: cargo build --locked --release

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write  # lets audit-check post annotations
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
