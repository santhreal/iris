name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Restrict the default token to read-only; jobs that need more declare it.
permissions:
  contents: read

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  package:
    name: Package
    uses: ./.github/workflows/package.yml

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `cargo audit` runs through the toolchain rust-toolchain.toml pins.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit
