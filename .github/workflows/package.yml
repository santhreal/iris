name: Package

# Builds every installer from the checked-out commit, installs and
# checks each one, and uploads it as an artifact. CI runs it on every
# push; the release workflow publishes the artifacts it uploads, so a
# release ships the files these checks ran on. Each platform builds
# and checks its installers natively, on a runner of its architecture.
on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings -Cforce-frame-pointers=yes -Coverflow-checks=on"

jobs:
  macos-ffmpeg:
    name: FFmpeg (macos-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-latest }
          - { arch: x86_64, runner: macos-15-intel }
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # iris_fetch_sha256 rehashes every restored archive and downloads
      # a mismatched one again, so the cache only skips the network.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build-staging/ffmpeg-source
          key: ffmpeg-source-${{ github.job }}-${{ matrix.arch }}-${{ hashFiles('packaging/ffmpeg_source.sh', 'packaging/windows/build_ffmpeg.sh') }}
      - name: Build and verify the native runtime
        run: |
          command -v nasm >/dev/null || brew install nasm
          command -v pkg-config >/dev/null || brew install pkg-config
          packaging/macos/build_ffmpeg.sh --out dist
          packaging/check_ffmpeg.sh dist/ffmpeg macos
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-ffmpeg-macos-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  macos:
    name: Package (macos-universal)
    runs-on: macos-latest
    needs: macos-ffmpeg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # With no toolchain argument, rustup installs the toolchain and
      # components rust-toolchain.toml pins; the targets go to that
      # toolchain.
      - name: Install the pinned toolchain and both macOS targets
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      # Only main saves a Rust cache: a pull request or a tag restores
      # main's, so its saves would only evict main's, the FFmpeg source
      # caches included, from the repository's cache space.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: package-macos-universal
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Version forms (packaging/lib.sh): the cargo version names the
      # assets and `iris --version` prints it; the bundle versions hold
      # its numeric core.
      - name: Read the version
        run: |
          . packaging/lib.sh
          version=$(iris_cargo_version .)
          core=$(iris_core_version "$version")
          { echo "VERSION=$version"; echo "CORE_VERSION=$core"; } >> "$GITHUB_ENV"
      # One cargo run for both targets: it compiles the two concurrently,
      # overlapping each target's single-threaded final crate and link.
      - name: Build the universal binary
        run: |
          cargo build --locked --release --target aarch64-apple-darwin --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/iris \
            target/aarch64-apple-darwin/release/iris \
            target/x86_64-apple-darwin/release/iris
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-ffmpeg-macos-arm64
          path: .build-staging/ffmpeg/macos-arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-ffmpeg-macos-x86_64
          path: .build-staging/ffmpeg/macos-x86_64
      - name: Combine and verify the universal FFmpeg runtime
        run: |
          set -euo pipefail
          universal=.build-staging/ffmpeg/macos-universal
          mkdir -p "$universal/licenses"
          lipo -create -output "$universal/ffmpeg" \
            .build-staging/ffmpeg/macos-arm64/ffmpeg \
            .build-staging/ffmpeg/macos-x86_64/ffmpeg
          chmod 0755 "$universal/ffmpeg"
          cp .build-staging/ffmpeg/macos-arm64/licenses/* "$universal/licenses/"
          diff -r -x FFMPEG-SOURCE.txt .build-staging/ffmpeg/macos-arm64/licenses \
            .build-staging/ffmpeg/macos-x86_64/licenses
          {
            printf 'arm64 runtime provenance:\n'
            cat .build-staging/ffmpeg/macos-arm64/licenses/FFMPEG-SOURCE.txt
            printf '\nx86_64 runtime provenance:\n'
            cat .build-staging/ffmpeg/macos-x86_64/licenses/FFMPEG-SOURCE.txt
            printf '\n%s\n' \
              'The universal executable combines runtimes built natively for arm64 and' \
              'x86_64 from the identical pinned sources above.'
          } > "$universal/licenses/FFMPEG-SOURCE.txt"
          for notice in compiler-rt.txt compiler-rt-CREDITS.txt; do
            cmp "packaging/licenses/$notice" "$universal/licenses/$notice"
          done
          archs=$(lipo -archs "$universal/ffmpeg")
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]] || { echo "FFmpeg archs: $archs"; exit 1; }
          packaging/check_ffmpeg.sh "$universal/ffmpeg" macos
      - name: Assemble iris.app and the DMG
        run: |
          packaging/macos/make_app.sh --bin target/universal-apple-darwin/release/iris \
            --ffmpeg .build-staging/ffmpeg/macos-universal --out dist
          packaging/macos/make_dmg.sh --app dist/iris.app --out dist
      - name: Verify the bundle and the DMG
        run: |
          set -euo pipefail
          # hdiutil fails with EAGAIN while another disk image operation
          # holds the DiskImages framework, such as a scan of the image
          # make_dmg.sh just wrote. iris --update retries its attach the
          # same way (sys::install::macos).
          hdiutil_busy() {
            local out
            for _ in $(seq 30); do
              if out=$(hdiutil "$@" 2>&1); then echo "$out"; return 0; fi
              [[ "$out" == *"Resource temporarily unavailable"* ]] || break
              echo "hdiutil $1: busy, retrying"
              sleep 1
            done
            echo "$out" >&2
            return 1
          }
          plist() { plutil -extract "$1" raw dist/iris.app/Contents/Info.plist; }
          dmg="iris-${VERSION}-macos-universal.dmg"
          codesign --verify --deep --strict dist/iris.app
          archs=$(lipo -archs dist/iris.app/Contents/MacOS/iris)
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]] || { echo "archs: $archs"; exit 1; }
          for key in CFBundleShortVersionString CFBundleVersion; do
            [ "$(plist "$key")" = "$CORE_VERSION" ] || { echo "$key $(plist "$key"), not $CORE_VERSION"; exit 1; }
          done
          [ "$(plist IrisVersion)" = "$VERSION" ] || { echo "IrisVersion $(plist IrisVersion), not $VERSION"; exit 1; }
          (cd dist && shasum -a 256 -c "$dmg.sha256")
          hdiutil_busy verify "dist/$dmg"
          mnt=$(mktemp -d)
          hdiutil_busy attach -nobrowse -readonly -mountpoint "$mnt" "dist/$dmg"
          [ -L "$mnt/Applications" ]
          [ "$("$mnt/iris.app/Contents/MacOS/iris" --version)" = "iris $VERSION" ]
          ditto "$mnt/iris.app" "$RUNNER_TEMP/installed/iris.app"
          hdiutil_busy detach "$mnt"
          bundled="$RUNNER_TEMP/installed/iris.app/Contents/MacOS/ffmpeg"
          [ -f "$RUNNER_TEMP/installed/iris.app/Contents/Resources/ffmpeg/FFMPEG-SOURCE.txt" ]
          packaging/check_ffmpeg.sh "$bundled" macos
      # The daemon starts from the DMG's iris.app copied out as an install
      # copies it, binds its socket, and exits on --quit. Its first start
      # writes the LaunchAgent; a later start leaves a deleted one deleted.
      - name: Run the bundle's daemon
        run: |
          set -euo pipefail
          exe="$RUNNER_TEMP/installed/iris.app/Contents/MacOS/iris"
          export IRIS_HOME="$RUNNER_TEMP/iris-home" XDG_RUNTIME_DIR="$RUNNER_TEMP/iris-run"
          mkdir -m 0700 "$XDG_RUNTIME_DIR"
          log="$IRIS_HOME/state/iris.log"
          agent="$HOME/Library/LaunchAgents/dev.iris.app.plist"
          fail() { echo "$1"; cat "$log" 2>/dev/null || true; exit 1; }
          rm -f "$agent"
          quit() {
            "$exe" --quit || fail "iris --quit exited with $?"
            for _ in $(seq 100); do kill -0 "$1" 2>/dev/null || break; sleep 0.1; done
            ! kill -0 "$1" 2>/dev/null || fail "the daemon runs 10 s after --quit"
          }
          "$exe" --home || fail "iris --home exited with $?"
          pid=$(pgrep -f "installed/iris.app/Contents/MacOS/iris --daemon") || fail "no daemon runs from the bundle"
          grep -q "iris: daemon start" "$log" || fail "the daemon logged no start line"
          for _ in $(seq 100); do [ -f "$agent" ] && break; sleep 0.1; done
          grep -qF "installed/iris.app/Contents/MacOS/iris</string>" "$agent" \
            || fail "the first start wrote no LaunchAgent for the bundle"
          quit "$pid"
          rm "$agent"
          "$exe" --home || fail "iris --home exited with $?"
          pid=$(pgrep -f "installed/iris.app/Contents/MacOS/iris --daemon") || fail "no daemon runs from the bundle"
          sleep 3
          [ ! -e "$agent" ] || fail "a later start turned Start at login back on"
          quit "$pid"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iris-macos-universal
          path: dist/iris-*-macos-universal.dmg*
          if-no-files-found: error

  windows-ffmpeg:
    name: FFmpeg (windows-${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The cache holds the source archives and the cross toolchain.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build-staging/ffmpeg-source
          key: ffmpeg-source-${{ github.job }}-${{ matrix.arch }}-${{ hashFiles('packaging/ffmpeg_source.sh', 'packaging/windows/build_ffmpeg.sh') }}
      - name: Install the cross-build tools
        run: sudo apt-get update && sudo apt-get install -y nasm pkg-config
      - name: Build the pinned source runtime
        run: |
          packaging/windows/build_ffmpeg.sh --arch "$ARCH" --out dist
          for notice in compiler-rt.txt compiler-rt-CREDITS.txt; do
            cmp "packaging/licenses/$notice" "dist/licenses/$notice"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-ffmpeg-windows-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  windows:
    name: Package (windows-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: windows-ffmpeg
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: windows-latest }
          - { arch: aarch64, runner: windows-11-arm }
    env:
      ARCH: ${{ matrix.arch }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: package-windows-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Version forms (packaging/lib.sh): the cargo version names the
      # assets and fills the string versions; the numeric VERSIONINFO
      # holds its core plus .0.
      - name: Read the version
        shell: bash
        run: |
          . packaging/lib.sh
          version=$(iris_cargo_version .)
          core=$(iris_core_version "$version")
          { echo "VERSION=$version"; echo "CORE_VERSION=$core"; } >> "$GITHUB_ENV"
      # Later steps start with the job's PATH, not the machine PATH an
      # installer edits: GITHUB_PATH adds the NSIS directory to it. choco
      # exits 0 having installed nothing when the community feed answers
      # 503, so the step checks for makensis.exe itself and retries.
      - name: Install NSIS
        run: |
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          foreach ($try in 1..5) {
            choco install nsis -y --no-progress
            if (Test-Path $makensis) { break }
            if ($try -lt 5) { Start-Sleep -Seconds (20 * $try) }
          }
          if (-not (Test-Path $makensis)) { throw "5 choco installs left no $makensis" }
          Add-Content $env:GITHUB_PATH (Split-Path $makensis)
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-ffmpeg-windows-${{ matrix.arch }}
          path: .build-staging/ffmpeg/windows-${{ matrix.arch }}
      - name: Verify the bundled runtime natively
        shell: bash
        run: packaging/check_ffmpeg.sh ".build-staging/ffmpeg/windows-$ARCH/ffmpeg.exe" windows
      # --arch fails the scripts when iris.exe is built for another
      # architecture than the runner's.
      - name: Build iris.exe, the installer, and the portable zip
        shell: bash
        run: |
          cargo build --locked --release --bin iris
          runtime=".build-staging/ffmpeg/windows-$ARCH"
          bash packaging/windows/build_installer.sh --bin target/release/iris.exe --ffmpeg "$runtime" --out dist --arch "$ARCH"
          bash packaging/windows/build_portable.sh --bin target/release/iris.exe --ffmpeg "$runtime" --out dist --arch "$ARCH"
      # The updater unpacks the portable zip with the tar.exe Windows
      # ships and runs the iris\iris.exe in it (sys/install/windows.rs).
      - name: Unpack and run the portable zip
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:VERSION
          $zip = "dist\iris-$version-windows-$env:ARCH-portable.zip"
          $sidecar = (Get-Content "$zip.sha256" -Raw).Split(' ')[0].Trim()
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $sidecar) { throw "sha256 $hash, sidecar $sidecar" }
          $dir = Join-Path $env:RUNNER_TEMP 'portable'
          New-Item -ItemType Directory $dir | Out-Null
          & "$env:SystemRoot\System32\tar.exe" -xf $zip -C $dir
          if ($LASTEXITCODE -ne 0) { throw "tar.exe -xf exited $LASTEXITCODE" }
          $held = @(Get-ChildItem -Recurse -File $dir | ForEach-Object { $_.FullName.Substring($dir.Length + 1) } | Sort-Object)
          $want = @(
            'iris\ffmpeg.exe',
            'iris\Inter-OFL.txt',
            'iris\iris.exe',
            'iris\LICENSE-APACHE',
            'iris\LICENSE-MIT',
            'iris\licenses\ffmpeg\FFmpeg-LICENSE.txt',
            'iris\licenses\ffmpeg\FFMPEG-SOURCE.txt',
            'iris\licenses\ffmpeg\FFmpeg.txt',
            'iris\licenses\ffmpeg\libvpx.txt',
            'iris\licenses\ffmpeg\nv-codec-headers.txt',
            'iris\licenses\ffmpeg\LLVM.txt',
            'iris\licenses\ffmpeg\compiler-rt.txt',
            'iris\licenses\ffmpeg\compiler-rt-CREDITS.txt',
            'iris\licenses\ffmpeg\mingw-w64-runtime.txt',
            'iris\licenses\ffmpeg\Opus.txt',
            'iris\licenses\ffmpeg\x264.txt',
            'iris\licenses\ffmpeg\zlib.txt'
          ) | Sort-Object
          if (($held -join ',') -ne ($want -join ',')) { throw "the zip holds $($held -join ', ')" }
          $runtime = ".build-staging\ffmpeg\windows-$env:ARCH\ffmpeg.exe"
          if ((Get-FileHash "$dir\iris\ffmpeg.exe").Hash -ne (Get-FileHash $runtime).Hash) { throw 'the zip holds another ffmpeg.exe' }
          $exe = "$dir\iris\iris.exe"
          if ((Get-FileHash $exe).Hash -ne (Get-FileHash target\release\iris.exe).Hash) { throw 'the zip holds another iris.exe' }
          $printed = & $exe --version | Write-Output
          if ($printed -ne "iris $version") { throw "--version printed '$printed'" }
      - name: Install, upgrade over a running daemon, and uninstall
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:VERSION
          $setup = "dist\iris-$version-windows-$env:ARCH-setup.exe"
          $sidecar = (Get-Content "$setup.sha256" -Raw).Split(' ')[0].Trim()
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $sidecar) { throw "sha256 $hash, sidecar $sidecar" }
          $dir = Join-Path $env:RUNNER_TEMP 'iris'
          Start-Process -Wait -FilePath $setup -ArgumentList '/S', '/DESKTOP', "/D=$dir"
          foreach ($f in 'iris.exe', 'ffmpeg.exe', 'iris.ico', 'uninstall.exe', 'LICENSE-MIT', 'LICENSE-APACHE', 'Inter-OFL.txt', 'licenses\ffmpeg\FFmpeg.txt', 'licenses\ffmpeg\FFmpeg-LICENSE.txt', 'licenses\ffmpeg\FFMPEG-SOURCE.txt', 'licenses\ffmpeg\x264.txt', 'licenses\ffmpeg\libvpx.txt', 'licenses\ffmpeg\Opus.txt', 'licenses\ffmpeg\zlib.txt', 'licenses\ffmpeg\nv-codec-headers.txt', 'licenses\ffmpeg\LLVM.txt', 'licenses\ffmpeg\compiler-rt.txt', 'licenses\ffmpeg\compiler-rt-CREDITS.txt', 'licenses\ffmpeg\mingw-w64-runtime.txt') {
            if (-not (Test-Path "$dir\$f")) { throw "setup did not install $f" }
          }
          $runtime = ".build-staging\ffmpeg\windows-$env:ARCH\ffmpeg.exe"
          if ((Get-FileHash "$dir\ffmpeg.exe").Hash -ne (Get-FileHash $runtime).Hash) { throw 'setup installed another ffmpeg.exe' }
          $exe = Get-Item "$dir\iris.exe"
          $info = $exe.VersionInfo
          if ($info.ProductVersion -ne $version) { throw "ProductVersion $($info.ProductVersion)" }
          $numeric = "$($info.ProductMajorPart).$($info.ProductMinorPart).$($info.ProductBuildPart).$($info.ProductPrivatePart)"
          if ($numeric -ne "$env:CORE_VERSION.0") { throw "numeric product version $numeric, not $env:CORE_VERSION.0" }
          # PE header: Machine is 0x8664 on x86_64 and 0xAA64 on aarch64;
          # optional header Subsystem 2 is a GUI program, 3 a console one.
          $pe = [IO.File]::ReadAllBytes($exe.FullName)
          $header = [BitConverter]::ToInt32($pe, 0x3C)
          $machine = [BitConverter]::ToUInt16($pe, $header + 4)
          $want = @{ x86_64 = 0x8664; aarch64 = 0xAA64 }[$env:ARCH]
          if ($machine -ne $want) { throw ('iris.exe machine 0x{0:X4}, not 0x{1:X4}' -f $machine, $want) }
          $subsystem = [BitConverter]::ToUInt16($pe, $header + 0x5C)
          if ($subsystem -ne 2) { throw "iris.exe subsystem $subsystem, not GUI (2)" }
          # PowerShell waits for a GUI-subsystem program only when its
          # output feeds a pipeline (docs/platforms.md, Windows).
          $printed = & $exe.FullName --version | Write-Output
          if ($printed -ne "iris $version") { throw "--version printed '$printed'" }
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $uninstall = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\iris'
          if ((Get-ItemProperty $run).iris -ne "`"$dir\iris.exe`" --daemon") { throw "Run value $((Get-ItemProperty $run).iris)" }
          if ((Get-ItemProperty $uninstall).DisplayVersion -ne $version) { throw 'Uninstall DisplayVersion' }
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'iris.lnk'
          $desktop = Join-Path ([Environment]::GetFolderPath('Desktop')) 'iris.lnk'
          $shell = New-Object -ComObject WScript.Shell
          function Assert-Shortcut([string]$path) {
            if (-not (Test-Path $path)) { throw "setup did not create $path" }
            $s = $shell.CreateShortcut($path)
            if ($s.TargetPath -ne "$dir\iris.exe" -or $s.Arguments -ne '--home') { throw "$path runs '$($s.TargetPath)' '$($s.Arguments)'" }
          }
          Assert-Shortcut $lnk
          Assert-Shortcut $desktop
          # An upgrade rewrites a desktop shortcut that exists.
          $stale = $shell.CreateShortcut($desktop)
          $stale.TargetPath = "$env:SystemRoot\notepad.exe"
          $stale.Arguments = ''
          $stale.Save()
          # Upgrade over a running daemon with the options `iris --update`
          # passes: the installer asks the daemon to quit, waits while a
          # second process holds iris.exe open, replaces it, and starts
          # iris (/RUN). Start-Process -Wait would also wait for that
          # iris, a descendant of the installer.
          function Wait-Until([scriptblock]$cond, [string]$what) {
            $deadline = (Get-Date).AddSeconds(30)
            while (-not (& $cond)) {
              if ((Get-Date) -gt $deadline) { throw "timed out waiting for $what" }
              Start-Sleep -Milliseconds 200
            }
          }
          # The daemon's pipe holds the account's SID (docs/cli.md).
          $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $pipe = { [IO.Directory]::GetFiles('\\.\pipe\') -contains "\\.\pipe\iris-$sid" }
          $irises = { @(Get-CimInstance Win32_Process -Filter "Name='iris.exe'" | Where-Object ExecutablePath -eq "$dir\iris.exe") }
          $daemon = Start-Process -PassThru -FilePath "$dir\iris.exe"
          $null = $daemon.Handle
          Wait-Until $pipe 'the daemon pipe'
          $held = Join-Path $env:RUNNER_TEMP 'iris-held'
          $hold = "`$f = [IO.File]::Open('$dir\iris.exe', 'Open', 'Read', 'Read'); New-Item '$held' | Out-Null; Start-Sleep 5; `$f.Close()"
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($hold))
          Start-Process -WindowStyle Hidden -FilePath powershell -ArgumentList '-NoProfile', '-EncodedCommand', $encoded
          Wait-Until { Test-Path $held } 'the process holding iris.exe'
          # Start at login turned off (Settings deletes the Run value):
          # the upgrade writes none.
          Remove-ItemProperty $run -Name iris
          $clock = [Diagnostics.Stopwatch]::StartNew()
          $upgrade = Start-Process -PassThru -FilePath $setup -ArgumentList '/S', '/RUN'
          $null = $upgrade.Handle
          if (-not $upgrade.WaitForExit(120000)) { throw 'the upgrade ran over 120 s' }
          $took = $clock.ElapsedMilliseconds
          if ($upgrade.ExitCode -ne 0) { throw "upgrade exit code $($upgrade.ExitCode) after $took ms" }
          if ($took -lt 4000) { throw "the upgrade took $took ms: it did not wait for iris.exe" }
          if (-not $daemon.HasExited) { throw 'the daemon runs after the upgrade' }
          Wait-Until $pipe 'the pipe of the iris /RUN started'
          $after = @(& $irises)
          if ($after.Count -ne 1 -or $after[0].ProcessId -eq $daemon.Id) { throw "iris processes after the upgrade: $($after.ProcessId)" }
          if ((Get-Item $run).Property -contains 'iris') { throw 'the upgrade wrote the Run value the account deleted' }
          Assert-Shortcut $desktop
          # An upgrade without /DESKTOP creates no desktop shortcut.
          Remove-Item $desktop
          # An upgrade rewrites a Run value that exists, and waits for
          # a held ffmpeg.exe even after the daemon has quit.
          Set-ItemProperty $run -Name iris -Value 'stale'
          $held = Join-Path $env:RUNNER_TEMP 'ffmpeg-held'
          $hold = "`$f = [IO.File]::Open('$dir\ffmpeg.exe', 'Open', 'Read', 'Read'); New-Item '$held' | Out-Null; Start-Sleep 5; `$f.Close()"
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($hold))
          Start-Process -WindowStyle Hidden -FilePath powershell -ArgumentList '-NoProfile', '-EncodedCommand', $encoded
          Wait-Until { Test-Path $held } 'the process holding ffmpeg.exe'
          $clock = [Diagnostics.Stopwatch]::StartNew()
          $upgrade = Start-Process -PassThru -FilePath $setup -ArgumentList '/S'
          $null = $upgrade.Handle
          if (-not $upgrade.WaitForExit(120000)) { throw 'the ffmpeg.exe upgrade ran over 120 s' }
          $took = $clock.ElapsedMilliseconds
          if ($upgrade.ExitCode -ne 0) { throw "ffmpeg.exe upgrade exit code $($upgrade.ExitCode) after $took ms" }
          if ($took -lt 4000) { throw "the upgrade took $took ms: it did not wait for ffmpeg.exe" }
          if ((Get-ItemProperty $run).iris -ne "`"$dir\iris.exe`" --daemon") { throw "Run value after an upgrade: $((Get-ItemProperty $run).iris)" }
          if (Test-Path $desktop) { throw 'an upgrade without /DESKTOP created a desktop shortcut' }
          $again = $shell.CreateShortcut($desktop)
          $again.TargetPath = "$dir\iris.exe"
          $again.Arguments = '--home'
          $again.Save()
          # The uninstaller runs from a copy in %TEMP% and returns at once.
          Start-Process -Wait -FilePath "$dir\uninstall.exe" -ArgumentList '/S'
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path $dir) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 250 }
          if (Test-Path $dir) { throw "$dir remains after uninstall" }
          if (Test-Path $lnk) { throw "$lnk remains after uninstall" }
          if (Test-Path $desktop) { throw "$desktop remains after uninstall" }
          if ((Get-Item $run).Property -contains 'iris') { throw 'Run value remains after uninstall' }
          if (Test-Path $uninstall) { throw 'Uninstall key remains after uninstall' }
          if (@(& $irises).Count) { throw 'iris runs after uninstall' }
          if (& $pipe) { throw 'the daemon pipe remains after uninstall' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iris-windows-${{ matrix.arch }}
          path: dist/iris-*-windows-${{ matrix.arch }}-*
          if-no-files-found: error

  linux:
    name: Package (linux-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Version forms (packaging/lib.sh): the cargo version names the
      # assets and `iris --version` prints it; the deb and rpm Version
      # hold its tilde form. The packages in dist/next are the same
      # binary at NEXT_VERSION, so installing one over the first is a
      # package upgrade.
      - name: Read the versions
        run: |
          . packaging/lib.sh
          version=$(iris_cargo_version .)
          tilde=$(iris_tilde_version "$version")
          next_tilde=$(iris_tilde_version "$version.1")
          channel=$(sed -nE 's/^channel = "([^"]+)"/\1/p' rust-toolchain.toml)
          [ -n "$channel" ] || { echo "rust-toolchain.toml pins no channel"; exit 1; }
          {
            echo "VERSION=$version"
            echo "TILDE_VERSION=$tilde"
            echo "NEXT_VERSION=$version.1"
            echo "NEXT_TILDE_VERSION=$next_tilde"
            echo "RUST_CHANNEL=$channel"
          } >> "$GITHUB_ENV"
      - name: Install packaging deps
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm desktop-file-utils
      # The runner's toolchain keys the cache to the pinned version the
      # Debian container builds with.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: package-linux-${{ matrix.arch }}-bookworm
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build-staging/ffmpeg-source
          key: ffmpeg-source-${{ github.job }}-${{ matrix.arch }}-${{ hashFiles('packaging/ffmpeg_source.sh', 'packaging/windows/build_ffmpeg.sh') }}
      # The binary builds on Debian 12, so it links no glibc symbol
      # version newer than that release has, and the packages run on
      # the oldest glibc that holds every version it uses: 2.35 (Ubuntu
      # 22.04). A binary built on the runner requires the runner's glibc.
      # build_deb.sh reads the floor from the binary. The container's
      # image holds the pinned toolchain, and it reads and writes the
      # runner's cargo registry, so the cache holds both.
      - name: Build iris and FFmpeg on Debian 12
        run: |
          cargo_home=${CARGO_HOME:-$HOME/.cargo}
          mkdir -p "$cargo_home/registry" "$cargo_home/git"
          docker run --rm -v "$PWD:/src" -w /src \
            -v "$cargo_home/registry:/usr/local/cargo/registry" -v "$cargo_home/git:/usr/local/cargo/git" \
            -e owner="$(id -u):$(id -g)" -e RUSTFLAGS -e CARGO_TERM_COLOR -e ARCH \
            "rust:$RUST_CHANNEL-bookworm" \
            bash -euo pipefail -c '
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends build-essential pkg-config cmake clang \
                libasound2-dev libfontconfig-dev libglib2.0-dev libssl-dev \
                libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libxcb1-dev \
                libvulkan1 libegl1-mesa-dev libgl1-mesa-dev \
                libpipewire-0.3-dev libspa-0.2-dev \
                nasm libpulse-dev zlib1g-dev >/dev/null
              cargo build --locked --release --bin iris
              packaging/linux/build_ffmpeg.sh --out ".build-staging/ffmpeg/linux-$ARCH"
              packaging/check_ffmpeg.sh ".build-staging/ffmpeg/linux-$ARCH/ffmpeg" linux
              chown "$owner" .build-staging .build-staging/ffmpeg
              chown -R "$owner" target .build-staging/ffmpeg-source ".build-staging/ffmpeg/linux-$ARCH" /usr/local/cargo/registry /usr/local/cargo/git
            '
      # --arch fails the scripts when the binary is built for another
      # architecture than the runner's.
      - name: Build the deb, the rpm, and the AppImage
        run: |
          bin=target/release/iris
          runtime=".build-staging/ffmpeg/linux-$ARCH"
          bash packaging/linux/build_deb.sh --bin "$bin" --ffmpeg "$runtime" --out dist --arch "$ARCH"
          bash packaging/linux/build_rpm.sh --bin "$bin" --ffmpeg "$runtime" --out dist --arch "$ARCH"
          bash packaging/linux/build_appimage.sh --bin "$bin" --ffmpeg "$runtime" --out dist --arch "$ARCH"
          bash packaging/linux/build_deb.sh --bin "$bin" --ffmpeg "$runtime" --version "$NEXT_VERSION" --out dist/next --skip-sha --arch "$ARCH"
          bash packaging/linux/build_rpm.sh --bin "$bin" --ffmpeg "$runtime" --version "$NEXT_VERSION" --out dist/next --skip-sha --arch "$ARCH"
      # Each package installs in a clean container without the packages
      # it recommends, so a library it does not depend on is missing
      # there: the deb on ubuntu:22.04, the oldest release it supports,
      # and on ubuntu:24.04; the rpm on fedora:42. In each,
      # check_installed.sh starts the daemon on Xvfb with the lavapipe
      # Vulkan driver and waits for the home window. The package from
      # dist/next then upgrades the running install: the daemon runs on
      # the replaced binary, exits on --quit from the upgraded one, and
      # the upgraded iris starts. The AppImage mounts itself with FUSE on
      # ubuntu:22.04 with the libraries the deb depends on and no more,
      # and check_installed.sh runs its daemon.
      - name: Install, run, and remove each package
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c ./*.sha256)
          files="/usr/bin/iris /usr/share/applications/dev.iris.app.desktop /etc/xdg/autostart/iris-autostart.desktop"
          # in_container IMAGE SCRIPT [docker run option...]
          in_container() {
            local image=$1 script=$2
            shift 2
            docker run --rm "$@" -v "$PWD/dist:/pkg:ro" -v "$PWD/packaging/linux:/linux:ro" \
              -v "$PWD/packaging/check_ffmpeg.sh:/check_ffmpeg.sh:ro" \
              -e version="$VERSION" -e tilde="$TILDE_VERSION" -e next="$NEXT_VERSION" \
              -e next_tilde="$NEXT_TILDE_VERSION" -e arch="$ARCH" -e files="$files" \
              "$image" bash -euo pipefail -c "$script"
          }
          # The single-quoted scripts expand their variables in the container.
          # shellcheck disable=SC2016
          deb='
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends "/pkg/iris-${version}-linux-${arch}.deb" >/dev/null
            [ "$(iris --version)" = "iris $version" ]
            [ "$(dpkg-query -W -f="\${Version}" iris)" = "$tilde" ]
            for f in $files; do dpkg -L iris | grep -qx "$f" || { echo "deb lacks $f"; exit 1; }; done
            dpkg -L iris | grep -qx /usr/lib/iris/ffmpeg
            dpkg -L iris | grep -qx /usr/share/doc/iris/ffmpeg/FFMPEG-SOURCE.txt
            bash /check_ffmpeg.sh /usr/lib/iris/ffmpeg linux
            ! command -v ffmpeg
            apt-get install -y -qq --no-install-recommends xvfb x11-utils mesa-vulkan-drivers >/dev/null
            bash /linux/check_installed.sh --upgrade \
              "apt-get install -y -qq --no-install-recommends /pkg/next/iris-${next}-linux-${arch}.deb >/dev/null"
            [ "$(dpkg-query -W -f="\${Version}" iris)" = "$next_tilde" ]
            apt-get remove -y -qq iris >/dev/null
            for f in $files /usr/lib/iris/ffmpeg; do [ ! -e "$f" ] || { echo "$f remains after remove"; exit 1; }; done
          '
          in_container ubuntu:22.04 "$deb"
          in_container ubuntu:24.04 "$deb"
          # shellcheck disable=SC2016
          in_container fedora:42 '
            dnf install -y -q --setopt=install_weak_deps=False "/pkg/iris-${version}-linux-${arch}.rpm" >/dev/null
            [ "$(iris --version)" = "iris $version" ]
            [ "$(rpm -q --qf "%{VERSION}" iris)" = "$tilde" ]
            for f in $files; do rpm -ql iris | grep -qx "$f" || { echo "rpm lacks $f"; exit 1; }; done
            rpm -ql iris | grep -qx /usr/lib64/iris/ffmpeg
            rpm -ql iris | grep -qx /usr/share/licenses/iris/ffmpeg/FFMPEG-SOURCE.txt
            bash /check_ffmpeg.sh /usr/lib64/iris/ffmpeg linux
            ! command -v ffmpeg
            dnf install -y -q --setopt=install_weak_deps=False xorg-x11-server-Xvfb xdpyinfo xwininfo mesa-vulkan-drivers >/dev/null
            bash /linux/check_installed.sh --upgrade \
              "dnf install -y -q --setopt=install_weak_deps=False /pkg/next/iris-${next}-linux-${arch}.rpm >/dev/null"
            [ "$(rpm -q --qf "%{VERSION}" iris)" = "$next_tilde" ]
            dnf remove -y -q iris >/dev/null
            for f in $files /usr/lib64/iris/ffmpeg; do [ ! -e "$f" ] || { echo "$f remains after remove"; exit 1; }; done
          '
          # shellcheck disable=SC2016
          in_container ubuntu:22.04 '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            libs=$(dpkg-deb -f "/pkg/iris-${version}-linux-${arch}.deb" Depends | sed -E "s/ \([^)]*\)//g; s/, /\n/g")
            apt-get install -y -qq --no-install-recommends $libs fuse3 xvfb x11-utils mesa-vulkan-drivers >/dev/null
            [ "$(/pkg/iris-${version}-linux-${arch}.AppImage --version)" = "iris $version" ]
            work=$(mktemp -d)
            cd "$work"
            /pkg/iris-${version}-linux-${arch}.AppImage --appimage-extract >/dev/null
            [ -f "$work/squashfs-root/usr/share/doc/iris/ffmpeg/FFMPEG-SOURCE.txt" ]
            bash /check_ffmpeg.sh "$work/squashfs-root/usr/bin/ffmpeg" linux
            ! command -v ffmpeg
            bash /linux/check_installed.sh "/pkg/iris-${version}-linux-${arch}.AppImage"
          ' --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor:unconfined
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iris-linux-${{ matrix.arch }}
          path: dist/iris-*-linux-${{ matrix.arch }}.*
          if-no-files-found: error
