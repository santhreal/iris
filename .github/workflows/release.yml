name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # id-token for cosign keyless signing: the workflow's OIDC token is
  # exchanged for a short-lived Sigstore certificate binding the
  # signature to this workflow + commit + tag. No long-lived key.
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings -Cforce-frame-pointers=yes -Coverflow-checks=on"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_STRIP: "true"

jobs:
  ci:
    name: Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      # ffmpeg: the recorder tests encode, join, and ffprobe real files.
      - name: Install Linux build deps and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake clang \
            libasound2-dev libfontconfig-dev libglib2.0-dev libssl-dev \
            libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libxcb1-dev \
            libvulkan1 libegl1-mesa-dev libgl1-mesa-dev \
            libpipewire-0.3-dev libspa-0.2-dev xdg-desktop-portal ffmpeg
      - name: Test
        run: cargo test --locked

  windows:
    name: Windows installer
    needs: ci
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      # Later steps start with the job's PATH, not the machine PATH an
      # installer edits: GITHUB_PATH adds the NSIS directory to it.
      - name: Install NSIS
        run: |
          choco install nsis -y --no-progress
          Add-Content $env:GITHUB_PATH "${env:ProgramFiles(x86)}\NSIS"
      - name: Build iris
        run: cargo build --release --locked --bin iris
      - name: Build installer
        shell: bash
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          bash packaging/windows/build_installer.sh \
            --binary target/release/iris.exe \
            --out dist \
            --version "$version"
      - name: Upload installer
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  macos:
    name: macOS dmg
    needs: ci
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Build iris (universal)
        run: |
          cargo build --release --locked --bin iris --target x86_64-apple-darwin
          cargo build --release --locked --bin iris --target aarch64-apple-darwin
          lipo -create \
            target/x86_64-apple-darwin/release/iris \
            target/aarch64-apple-darwin/release/iris \
            -output target/release/iris
      - name: Build app bundle + dmg
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          bash packaging/macos/make_app.sh --bin target/release/iris --out dist --version "$version"
          bash packaging/macos/make_dmg.sh --app dist/iris.app --out dist --version "$version"
      - name: Upload dmg
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v2
        with:
          files: dist/*.dmg*
          fail_on_unmatched_files: true

  linux:
    name: Linux packages
    needs: ci
    # Pinned: the build host's glibc is the packages' glibc floor
    # (build_deb.sh reads it from the binary), so it moves only here.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      # build_appimage.sh fetches appimagetool and runs it with
      # --appimage-extract-and-run, so the runner needs no FUSE.
      - name: Install build + packaging deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake clang \
            libasound2-dev libfontconfig-dev libglib2.0-dev libssl-dev \
            libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libxcb1-dev \
            libvulkan1 libegl1-mesa-dev libgl1-mesa-dev \
            libpipewire-0.3-dev libspa-0.2-dev xdg-desktop-portal \
            rpm desktop-file-utils
      - name: Build iris
        run: cargo build --release --locked --bin iris
      - name: Build deb + rpm + AppImage
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          bash packaging/linux/build_deb.sh --bin target/release/iris --out dist --version "$version"
          bash packaging/linux/build_rpm.sh --bin target/release/iris --out dist --version "$version"
          bash packaging/linux/build_appimage.sh --bin target/release/iris --out dist --version "$version"
      - name: Upload packages
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
