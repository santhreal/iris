name: Release

on:
  push:
    tags:
      - 'v*'
  # A dry run: runs the gate, builds and checks every installer, and
  # checks the release's asset set. Only a tag publishes.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      # The updater compares the release tag with the version the
      # installed binary reports (CARGO_PKG_VERSION): a tag naming any
      # other version would offer the same release again after it is
      # installed.
      - name: The tag names the Cargo.toml version
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not name the Cargo.toml version $version (v$version)"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      # ffmpeg: the recorder tests encode, join, and ffprobe real files.
      - name: Install Linux build deps and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake clang \
            libasound2-dev libfontconfig-dev libglib2.0-dev libssl-dev \
            libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libxcb1-dev \
            libvulkan1 libegl1-mesa-dev libgl1-mesa-dev \
            libpipewire-0.3-dev libspa-0.2-dev xdg-desktop-portal ffmpeg
      - name: Test
        run: cargo test --locked

  package:
    name: Package
    needs: gate
    uses: ./.github/workflows/package.yml

  publish:
    name: Publish
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      # The release holds the assets packaging/CONTRACT.md lists, each
      # with its .sha256 sidecar, and nothing else. Every asset the
      # updater downloads (sys::install::ASSET on each platform) is one
      # of them.
      - name: The contract's asset set, every checksum
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n1)
          contract=$(sed -nE 's/^- `iris-\{ver\}-([^`]+)`.*/\1/p' packaging/CONTRACT.md | sort)
          updater=$(sed -nE 's/^pub const ASSET: &str = "([^"]+)";/\1/p' src/bin/iris/sys/install/*.rs | sort)
          [ -n "$contract" ] || { echo "packaging/CONTRACT.md lists no assets"; exit 1; }
          defs=$(grep -l 'const ASSET' src/bin/iris/sys/install/*.rs | wc -l)
          if [ "$defs" -eq 0 ] || [ "$(echo "$updater" | grep -c .)" -ne "$defs" ]; then
            echo "parsed updater assets [$updater] from $defs ASSET definitions"
            exit 1
          fi
          unlisted=$(comm -13 <(echo "$contract") <(echo "$updater"))
          [ -z "$unlisted" ] || { echo "the updater downloads assets the contract lacks: $unlisted"; exit 1; }
          want=$(for a in $contract; do echo "iris-$version-$a"; echo "iris-$version-$a.sha256"; done | sort)
          have=$(ls dist | sort)
          if [ "$want" != "$have" ]; then
            echo "release assets differ from the contract (< contract, > built):"
            diff <(echo "$want") <(echo "$have") || true
            exit 1
          fi
          (cd dist && sha256sum -c ./*.sha256)
      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
