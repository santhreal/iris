version: 2
updates:
  # Minor and patch updates of every crate arrive as one pull request a
  # week; each semver-major update arrives as its own.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
    # blocking stays on 1.6 (Cargo.toml): a 1.7 pool thread wakes every
    # 500 ms for the life of the process. tests/idle.rs fails on 1.7.
    ignore:
      - dependency-name: blocking
        versions: [">= 1.7"]

  # Every action update arrives as one pull request a week, the pinned
  # commit SHA and its version comment updated together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
